apiVersion: namespaceclass.akuity.io/v1alpha1
kind: NamespaceClass
metadata:
  labels:
    app.kubernetes.io/name: namespaceclass
    app.kubernetes.io/managed-by: kustomize
  name: namespaceclass-sample
spec:
  resources:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny-ingress
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress: []
